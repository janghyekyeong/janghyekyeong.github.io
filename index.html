<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>장혜경 | 모바일 명함</title>
  <style>
    @font-face {
      font-family: "한진체";
      src: local("한진체"), local("HanJin");
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "한진체", "Malgun Gothic", sans-serif;
      background: #eaf8ff;
      color: #24475b;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 22px;
    }

    .card {
      width: 100%;
      max-width: 420px;
      background: #fff;
      border-radius: 30px;
      overflow: hidden;
      box-shadow: 0 18px 50px rgba(75, 170, 210, 0.2);
    }

    .header {
      padding: 42px 28px;
      background: linear-gradient(145deg, #87ceeb, #c4efff);
    }

    .brand {
      font-size: 15px;
      font-weight: bold;
      letter-spacing: 2px;
      margin-bottom: 25px;
      color: #245b78;
    }

    h1 {
      font-size: 44px;
      letter-spacing: -1px;
      margin-bottom: 15px;
      color: #173d52;
    }

    .intro {
      font-size: 18px;
      line-height: 1.8;
      word-break: keep-all;
    }

    .content {
      padding: 32px 24px;
    }

    .section-title {
      font-size: 25px;
      margin-bottom: 22px;
    }

    .work-list {
      display: grid;
      gap: 14px;
    }

    .work {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 18px;
      background: #f1faff;
      border: 1px solid #d9f1fc;
      border-radius: 18px;
    }

    .icon {
      width: 54px;
      height: 54px;
      flex-shrink: 0;
      display: grid;
      place-items: center;
      border-radius: 16px;
      background: #d8f2ff;
      font-size: 28px;
    }

    .work h3 {
      font-size: 21px;
      margin-bottom: 6px;
    }

    .work p {
      font-size: 15px;
      line-height: 1.5;
      color: #668292;
      word-break: keep-all;
    }

    .footer {
      padding: 0 24px 30px;
    }

    .contact {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-height: 62px;
      border: none;
      border-radius: 18px;
      background: #70c9eb;
      color: #fff;
      font-family: inherit;
      font-size: 22px;
      font-weight: bold;
      text-decoration: none;
      cursor: pointer;
      transition: background 0.2s;
    }

    .contact:hover {
      background: #48b4df;
    }

    .signature {
      text-align: center;
      margin-top: 20px;
      font-size: 13px;
      color: #91a9b6;
      letter-spacing: 1px;
    }

    @media (max-width: 360px) {
      h1 { font-size: 38px; }
      .header { padding: 34px 22px; }
      .content { padding: 28px 18px; }
      .footer { padding: 0 18px 24px; }
    }
  </style>
</head>
<body>
  <main class="card">
    <header class="header">
      <p class="brand">ASIANA AIRLINES</p>
      <h1>장혜경</h1>
      <p class="intro">
        아시아나항공 객실훈련팀 강사<br>
        더 나은 서비스와 소통을 위해<br>
        함께 배우고 성장합니다.
      </p>
    </header>

    <section class="content">
      <h2 class="section-title">What I Do</h2>
      <div class="work-list">
        <article class="work">
          <div class="icon">✈️</div>
          <div>
            <h3>승무원</h3>
            <p>안전과 서비스의 가치를 실천합니다.</p>
          </div>
        </article>

        <article class="work">
          <div class="icon">🤝</div>
          <div>
            <h3>서비스강사</h3>
            <p>고객 감동을 만드는 서비스 역량을 교육합니다.</p>
          </div>
        </article>

        <article class="work">
          <div class="icon">🎙️</div>
          <div>
            <h3>방송강사</h3>
            <p>전달력 있는 목소리와 기내방송을 교육합니다.</p>
          </div>
        </article>
      </div>
    </section>

    <footer class="footer">
      <a
        class="contact"
        href="mailto:hkjang105d@flyasiana.com?subject=%EC%9E%A5%ED%98%9C%EA%B2%BD%20%EA%B0%95%EC%82%AC%20%EB%AC%B8%EC%9D%98"
      >문의하기 ✉</a>
      <p class="signature">AVIATION · SERVICE · COMMUNICATION</p>
    </footer>
  </main>
</body>
</html>
